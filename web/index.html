<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FamilyPouch - Smart family accounting, receipt OCR, cash float & bill splitting for employers and helper.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Force no-cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FamilyPouch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FamilyPouch • Family Accounting & Receipt OCR</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #0B0F19; overflow: hidden;">
  <script>
    // Force unregister all old service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) {
          reg.unregister();
        }
      });
    }
    // Delete all browser CacheStorage
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
    // Purge legacy storage keys once
    try {
      if (!localStorage.getItem('fp_v4_purged')) {
        localStorage.clear();
        localStorage.setItem('fp_v4_purged', 'true');
      }
    } catch(e) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
