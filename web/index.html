<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FamilyPouch - Smart family accounting, receipt OCR, cash float & bill splitting for employers and helper.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Force No-Cache Headers in HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FamilyPouch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FamilyPouch • Family Accounting & Receipt OCR</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #0B0F19; overflow: hidden;">
  <script>
    // 1. Unregister all service workers immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) {
          r.unregister();
        }
      });
    }

    // 2. Clear CacheStorage
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var k of keys) {
          caches.delete(k);
        }
      });
    }

    // 3. Clear legacy localStorage keys from old mock data
    try {
      var keysToRemove = [
        'flutter.fp_expenses',
        'flutter.fp_topups',
        'flutter.fp_claims',
        'flutter.fp_cycles',
        'fp_expenses',
        'fp_topups',
        'fp_claims',
        'fp_cycles'
      ];
      for (var key of keysToRemove) {
        localStorage.removeItem(key);
      }
    } catch (e) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
